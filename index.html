<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAIFAN PRO | EUR/USD</title>
<style>
:root {
  --bg:#07111f;
  --panel:#101e30;
  --line:#263b54;
  --text:#edf5ff;
  --muted:#9cb0c8;
  --green:#36d399;
  --red:#ff6b7a;
  --blue:#66b8ff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:radial-gradient(ellipse at top,#102742,var(--bg) 65%);
  color:var(--text);
  font:15px system-ui,Arial,sans-serif;
}
header,.wrap { max-width:1100px;margin:auto;padding:18px; }
h1 { margin:0;font-size:32px; }
h1 span { color:var(--blue); }
.sub,.small,.label,.foot { color:var(--muted); }
.sub { margin-top:5px; }
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.card {
  background:linear-gradient(145deg,#12243a,#0c1929);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
  min-width:0;
}
.label { font-size:12px;text-transform:uppercase; }
.value { font-size:23px;font-weight:750;margin-top:7px;overflow-wrap:anywhere; }
.small { font-size:12px;margin-top:6px;overflow-wrap:anywhere; }
.toolbar { display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;align-items:center; }
select,button {
  background:#172b43;
  border:1px solid #36516f;
  color:var(--text);
  border-radius:9px;
  padding:11px;
  font:inherit;
}
button { cursor:pointer;font-weight:bold; }
.primary { background:#1678c8; }
button:disabled { opacity:.5; }
.status {
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  margin:12px 0;
  overflow-wrap:anywhere;
}
.ok { color:var(--green); }
.bad { color:var(--red); }
.chartbox { height:330px;width:100%; }
canvas { display:block;width:100%;height:100%; }
.metrics {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.metric {
  background:#0a1726;
  padding:12px;
  border-radius:9px;
  border:1px solid var(--line);
  overflow-wrap:anywhere;
}
.metric b { display:block;font-size:18px;margin-top:5px; }
.scanbox {
  display:none;
  border:1px solid #28547a;
  border-radius:14px;
  padding:16px;
  margin:14px 0;
  background:#0a1b2b;
}
.scanbox.show { display:block; }
.scanline {
  height:3px;
  width:0;
  background:var(--blue);
  box-shadow:0 0 15px var(--blue);
  margin:14px 0;
}
.scanning .scanline {
  animation:scan 1.5s ease-in-out infinite alternate;
}
@keyframes scan {
  from { width:0; }
  to { width:100%; }
}
.result { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
.prob {
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  background:#0d1a29;
}
.pct { font-size:25px;font-weight:bold; }
.up { color:var(--green); }
.down { color:var(--red); }
.foot { font-size:12px;line-height:1.6;margin-top:14px; }
@media(max-width:450px) {
  header,.wrap { padding:10px; }
  .chartbox { height:270px; }
  .value { font-size:19px; }
  .result { grid-template-columns:1fr; }
}
</style>
</head>
